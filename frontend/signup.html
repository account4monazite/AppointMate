<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AppointMate</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="justify-content: center; align-items: center; background: radial-gradient(circle at 10% 20%, rgba(218, 112, 214, 0.08) 0%, rgba(230, 230, 250, 0) 90%);">
    
    <div class="card form-container">
        <a href="index.html" style="text-decoration: none; color: var(--primary-text); font-weight: 600; display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem;">
            ← Back to Home
        </a>
        <h2 class="form-title">Create Account</h2>
        <p class="form-subtitle text-muted">Join AppointMate for quick health scheduling</p>

        <div class="alert alert-danger" id="errorMessage"></div>
        <div class="alert alert-success" id="successMessage"></div>

        <form id="signupForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Repeat your password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-4" id="submitBtn">Sign Up</button>
        </form>

        <div class="form-footer">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
    </div>

    <script>
        document.getElementById("signupForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const submitBtn = document.getElementById("submitBtn");
            const errorDiv = document.getElementById("errorMessage");
            const successDiv = document.getElementById("successMessage");

            errorDiv.style.display = "none";
            successDiv.style.display = "none";

            if (password !== confirmPassword) {
                errorDiv.innerText = "Passwords do not match.";
                errorDiv.style.display = "block";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Creating account...";

            try {
                const response = await fetch("/api/v1/signup", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        role: "patient" // Standard public signup is for patients
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Signup failed. Please try again.");
                }

                successDiv.innerText = "Account created successfully! Redirecting to login...";
                successDiv.style.display = "block";

                setTimeout(() => {
                    window.location.href = "login.html";
                }, 1500);

            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.innerText = "Sign Up";
            }
        });
    </script>
</body>
</html>
