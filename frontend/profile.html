<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Up Profile - AppointMate</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background: radial-gradient(circle at 10% 20%, rgba(218, 112, 214, 0.08) 0%, rgba(230, 230, 250, 0) 90%); min-height: 100vh; display: flex; align-items: center; justify-content: center;">
    
    <div class="card form-container" style="max-width: 550px;">
        <h2 class="form-title" style="margin-bottom: 0.25rem;">Complete Your Profile</h2>
        <p class="form-subtitle text-muted" style="margin-bottom: 2rem;">Please provide your details to access the patient dashboard</p>

        <div class="alert alert-danger" id="errorMessage"></div>
        <div class="alert alert-success" id="successMessage"></div>

        <form id="profileForm">
            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" class="form-control" placeholder="Enter your full name" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="dob">Date of Birth *</label>
                    <input type="date" id="dob" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="gender">Gender *</label>
                    <select id="gender" class="form-control" required>
                        <option value="">--Select Gender--</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="contact">Contact Number *</label>
                <input type="tel" id="contact" class="form-control" placeholder="e.g. +91 9876543210" required>
            </div>

            <div class="form-group">
                <label for="allergies">Known Allergies / Medical Conditions</label>
                <textarea id="allergies" class="form-control" rows="3" placeholder="List any allergies (e.g. penicillin, peanuts) or write 'None'"></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-4" id="submitBtn">Save & Go to Dashboard</button>
        </form>
    </div>

    <script>
        // Check authentication
        const token = localStorage.getItem("token") || sessionStorage.getItem("token");
        if (!token) {
            window.location.href = "login.html";
        }

        document.getElementById("profileForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const fullName = document.getElementById("fullName").value.trim();
            const dob = document.getElementById("dob").value; // "YYYY-MM-DD"
            const gender = document.getElementById("gender").value;
            const contact = document.getElementById("contact").value.trim();
            const allergies = document.getElementById("allergies").value.trim() || "None";
            const submitBtn = document.getElementById("submitBtn");
            const errorDiv = document.getElementById("errorMessage");
            const successDiv = document.getElementById("successMessage");

            errorDiv.style.display = "none";
            successDiv.style.display = "none";
            submitBtn.disabled = true;
            submitBtn.innerText = "Saving profile...";

            try {
                // DOB needs to be a ISO timestamp for the FastAPI Pydantic schema (datetime field)
                const dobIso = new Date(dob).toISOString();

                const response = await fetch("/api/v1/patient/profile", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        pat_name: fullName,
                        dob: dobIso,
                        gender: gender,
                        contact: contact,
                        allergies: allergies
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Failed to create profile. Please check details.");
                }

                successDiv.innerText = "Profile created successfully! Loading dashboard...";
                successDiv.style.display = "block";

                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1200);

            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.innerText = "Save & Go to Dashboard";
            }
        });
    </script>
</body>
</html>
