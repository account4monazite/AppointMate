<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AppointMate</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="justify-content: center; align-items: center; background: radial-gradient(circle at 10% 20%, rgba(218, 112, 214, 0.08) 0%, rgba(230, 230, 250, 0) 90%);">
    
    <div class="card form-container">
        <a href="index.html" style="text-decoration: none; color: var(--primary-text); font-weight: 600; display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem;">
            ← Back to Home
        </a>
        <h2 class="form-title">Welcome Back</h2>
        <p class="form-subtitle text-muted">Sign in to manage your medical services</p>

        <div class="alert alert-danger" id="errorMessage"></div>
        <div class="alert alert-success" id="successMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem;">
                <input type="checkbox" id="remember" style="accent-color: var(--accent);">
                <label for="remember" style="margin-bottom: 0; cursor: pointer; font-weight: 500;">Remember me</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-4" id="submitBtn">Sign In</button>
        </form>

        <div class="form-footer">
            Don't have an account? <a href="signup.html">Create one</a>
        </div>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const submitBtn = document.getElementById("submitBtn");
            const errorDiv = document.getElementById("errorMessage");
            const successDiv = document.getElementById("successMessage");

            errorDiv.style.display = "none";
            successDiv.style.display = "none";
            submitBtn.disabled = true;
            submitBtn.innerText = "Signing in...";

            try {
                // OAuth2PasswordRequestForm expects URL-encoded parameters
                const params = new URLSearchParams();
                params.append("username", email);
                params.append("password", password);

                const response = await fetch("/api/v1/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: params
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Invalid credentials. Please try again.");
                }

                // Save token and role
                const storage = document.getElementById("remember").checked ? localStorage : sessionStorage;
                storage.setItem("token", data.access_token);
                storage.setItem("role", data.role);

                successDiv.innerText = "Login Successful! Redirecting...";
                successDiv.style.display = "block";

                setTimeout(async () => {
                    // Redirect based on role
                    if (data.role === "admin") {
                        window.location.href = "admin_dashboard.html";
                    } else if (data.role === "doctor") {
                        window.location.href = "doctor_dashboard.html";
                    } else {
                        // Check if patient profile exists
                        try {
                            const profileResponse = await fetch("/api/v1/patient/profile", {
                                headers: {
                                    "Authorization": `Bearer ${data.access_token}`
                                }
                            });
                            if (profileResponse.status === 404) {
                                // Redirect to profile page first-time login
                                window.location.href = "profile.html";
                            } else {
                                window.location.href = "dashboard.html";
                            }
                        } catch (err) {
                            window.location.href = "dashboard.html";
                        }
                    }
                }, 1000);

            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.innerText = "Sign In";
            }
        });
    </script>
</body>
</html>
